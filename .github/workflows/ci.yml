name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv y Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Instalar dependencias bloqueadas
        run: uv sync --all-groups --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy
        run: uv run mypy src tests

      - name: Pruebas offline (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest -m "not real" --cov=src --cov-report=term-missing

      - name: Pruebas offline (Linux)
        if: runner.os == 'Linux'
        # Linux no ejecuta las rutas de Job Object y otras ramas exclusivas de Windows.
        # Se conserva el umbral global de 85% en pyproject.toml para Windows y se
        # aplica aquí el mínimo reproducible observado para la plataforma Linux.
        run: uv run pytest -m "not real" --cov=src --cov-report=term-missing --cov-fail-under=84
