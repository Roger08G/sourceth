<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Sourceth CLI output demo</title>
  <desc id="desc">Terminal-style example showing a completed Sourceth fetch for a Polygon contract address.</desc>
  <rect width="1400" height="560" rx="18" fill="#0d1117"/>
  <rect width="1400" height="68" rx="18" fill="#161b22"/>
  <rect y="50" width="1400" height="18" fill="#161b22"/>
  <circle cx="34" cy="34" r="9" fill="#ff5f56"/>
  <circle cx="64" cy="34" r="9" fill="#ffbd2e"/>
  <circle cx="94" cy="34" r="9" fill="#27c93f"/>
  <text x="130" y="42" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="600">sourceth · CLI output</text>
  <rect x="1130" y="20" width="226" height="30" rx="15" fill="#238636"/>
  <text x="1243" y="41" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700">OFFLINE DEMO</text>
  <text x="48" y="122" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21">$ sourceth fetch 0xd91E80cF2E7be2e162c6513ceD06f1dD0dA35296 \</text>
  <text x="48" y="155" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21">  --chain 137 --validation explorer --verbose</text>
  <text x="48" y="207" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">DEBUG: Cast 1.8.3 · staging guard acquired</text>
  <text x="48" y="257" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" font-weight="700">Estado: complete</text>
  <text x="48" y="303" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21">Dirección: 0xd91E80cF2E7be2e162c6513ceD06f1dD0dA35296</text>
  <text x="48" y="349" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21">Manifiesto: ./downloads/137/&lt;address&gt;/runs/&lt;run-id&gt;/manifest.json</text>
  <text x="48" y="395" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21">- root: fuentes=downloaded, código=skipped</text>
  <line x1="48" y1="438" x2="1352" y2="438" stroke="#30363d"/>
  <text x="48" y="480" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">Sourceth 1.0.0 · Polygon Mainnet · salida determinista</text>
</svg>
