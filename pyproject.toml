[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sourceth"
version = "1.0.0"
description = "Descargador seguro y reproducible de fuentes publicadas de contratos EVM mediante Foundry Cast."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Roger Gomez Martinez" }]
dependencies = [
    "eth-hash[pycryptodome]>=0.7.1,<1",
    "eth-utils>=5.3.1,<6",
    "filelock>=3.16,<4",
    "python-dotenv>=1.1,<2",
]

[project.scripts]
sourceth = "src.cli:main"

[dependency-groups]
dev = ["mypy>=1.15,<3", "pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = ["real: prueba opt-in que requiere Cast, red y credenciales reales"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "S"]
ignore = [
    "S101", # pytest utiliza assert de forma intencional.
    "S603", # ProcessRunner valida el ejecutable y siempre usa shell=False.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
pretty = true
